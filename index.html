<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booker">
  <title>Kallang Booker Nuclear</title>
  <style>
    :root {
      --bg:       #0a1628;
      --surface:  #111f38;
      --border:   #1e3255;
      --green:    #1D9E75;
      --green-dk: #0F6E56;
      --green-lt: #9FE1CB;
      --red:      #ef4444;
      --amber:    #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --mono:     'JetBrains Mono', 'Fira Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
      max-width: 480px;
      margin: 0 auto;
    }

    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .header-icon { font-size: 30px; line-height: 1; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .card-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      color: var(--text); font-size: 15px; font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); }
    .field textarea { font-family: var(--mono); font-size: 11px; min-height: 76px; resize: none; line-height: 1.6; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .opens-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 12px; font-family: var(--mono); color: var(--green-lt); margin-top: 10px;
    }
    .opens-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    .btn-primary {
      width: 100%; padding: 15px; background: var(--green); color: white;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
      -webkit-appearance: none; letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:active { background: var(--green-dk); transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      width: 100%; padding: 13px; background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 12px; font-size: 14px;
      cursor: pointer; margin-top: 8px; -webkit-appearance: none;
    }
    .btn-secondary:active { border-color: var(--red); color: var(--red); }

    #run-screen { display: none; }
    #run-screen.show { display: block; }
    #setup-screen.hidden { display: none; }

    .script-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-family: var(--mono); font-size: 10px; color: var(--green-lt);
      line-height: 1.5; word-break: break-all; max-height: 120px; overflow-y: auto;
      margin-bottom: 10px; user-select: all;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🏸</div>
    <div>
      <div class="header-title">Kallang Booker</div>
      <div class="header-sub">Nuclear auto-booker</div>
    </div>
  </div>

  <div id="setup-screen">
    <div class="card">
      <div class="card-label">Target Slot</div>
      <div class="grid2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label>Time</label>
          <input type="time" id="time" value="07:00">
        </div>
      </div>
      <div class="opens-pill">
        <span class="dot"></span>
        <span id="opens-text">Select date and time</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Account</div>
      <div class="grid2">
        <div class="field">
          <label>User ID</label>
          <input type="number" id="userId" value="62061" inputmode="numeric">
        </div>
        <div class="field">
          <label>Rule ID</label>
          <input type="number" id="ruleId" value="19" inputmode="numeric">
        </div>
      </div>
      <div class="field">
        <label>Duration (min)</label>
        <select id="duration">
          <option value="60">60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Bearer Token</div>
      <div class="field">
        <label>JWT — no "Bearer " prefix</label>
        <textarea id="token" placeholder="eyJhbGci..." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
    </div>

    <button class="btn-primary" id="generate-btn">Generate &amp; Copy Script</button>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px;">
      Then open <strong style="color:var(--text)">thekallang.perfectgym.com</strong>, open DevTools console, paste &amp; run.
    </p>
  </div>

  <div id="run-screen">
    <div class="card">
      <div class="card-label">Script ready</div>
      <div class="script-box" id="script-preview"></div>
      <button class="btn-primary" id="copy-btn">Copy Script</button>
      <a id="open-btn" class="btn-primary" style="margin-top:8px;background:var(--green-dk)"
         href="https://thekallang.perfectgym.com/clientportal2/#/FacilityBooking"
         target="_blank" rel="noopener">Open Kallang →</a>
      <button class="btn-secondary">← Back</button>
    </div>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;">
      Paste into the browser console on the Kallang tab. Keep the tab open.
    </p>
  </div>

  <script>
(function () {
    'use strict';
    let generatedScript = '';

    function el(id) { return document.getElementById(id); }

    function setDateMin() {
      const today = new Date();
      el('date').min = today.toISOString().slice(0, 10);
    }

    function updateOpens() {
      const date = el('date').value;
      const time = el('time').value;
      const opensText = el('opens-text');
      if (!date || !time) { opensText.textContent = 'Select date and time'; return; }
      const openMs = new Date(date + 'T' + time + ':00').getTime() - 168 * 3600000;
      opensText.textContent = 'Opens: ' + new Date(openMs).toLocaleString('en-SG', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function generate() {
      try {
        const date = el('date').value;
        const time = el('time').value;
        const userId = el('userId').value;
        const ruleId = el('ruleId').value;
        const duration = el('duration').value;
        const token = el('token').value.replace(/\s+/g, '').trim();

        if (!date || !time || !token) { alert('Fill in date, time, and token'); return; }
        if (token.length < 20) { alert('Token looks too short. Check your JWT.'); return; }

        ['date', 'time', 'userId', 'ruleId', 'duration', 'token'].forEach(id => {
          localStorage.setItem('kb_' + id, el(id).value);
        });

        const startTime = date + 'T' + time + ':00';
        const openMs = new Date(startTime).getTime() - 168 * 3600000;

        generatedScript = generateScript({
          openMs,
          startTime,
          date,
          userId,
          ruleId,
          duration,
          token
        });

        el('script-preview').textContent = generatedScript.slice(0, 300) + '...';
        el('setup-screen').classList.add('hidden');
        el('run-screen').classList.add('show');
        copyScript();
      } catch (err) {
        console.error('Generate error:', err);
        alert('Error generating script: ' + err.message);
      }
    }

    function generateScript(cfg) {
      return `(async function() {
  'use strict';

  // Configuration
  const CONFIG = {
    openAtMs: ${cfg.openMs},
    startTime: '${cfg.startTime}',
    slotDate: '${cfg.date}',
    userId: ${cfg.userId},
    ruleId: ${cfg.ruleId},
    duration: ${cfg.duration},
    token: '${cfg.token}',
    base: 'https://thekallang.perfectgym.com/clientportal2',
    clubId: 1,
    zoneType: 31,
    retryDurationMs: 600 * 1000,
    parallelShots: 2,
    waveIntervalMs: 20,
    keepaliveMs: 5000,
    sessionsPerCourt: 5,
    serverClockRetries: 5,
    prefireMs: 15000,
    poolLowThreshold: 0.15,
    maxConcurrency: 3,
    warmupRequests: 2,
    buildDelay: 100
  };

  // State
  let sessionPool = [];
  let booked = false;
  let wakeLock = null;
  let serverClockOffset = 0;
  let clockSynced = false;
  let measuredLatency = 0;
  let originalPoolCount = 0;
  let availableZones = null;
  let preRebuilt = false;
  let keepaliveTimer = null;
  let countdownTimer = null;
  let fireInterval = null;

  // Stats
  const stats = {
    waveCount: 0,
    totalSent: 0,
    totalOk: 0,
    totalFail: 0,
    rateLimited: 0
  };

  // Cached values
  const cache = {
    openDate: null,
    openDateTs: 0,
    authHeaders: null,
    baseUrl: null
  };
  const CACHE_TTL = 5000;

  // Helpers
  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }

  function now() { return Date.now(); }

  function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

  function isCacheValid(key) {
    return cache[key + '_ts'] && (now() - cache[key + '_ts']) < CACHE_TTL;
  }

  function setCache(key, value) {
    cache[key] = value;
    cache[key + '_ts'] = now();
  }

  function getOpenDate() {
    if (isCacheValid('openDate')) return cache.openDate;
    const d = new Date(CONFIG.openAtMs + serverClockOffset);
    const date = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    setCache('openDate', date);
    return date;
  }

  function getAuthHeaders() {
    if (isCacheValid('authHeaders')) return cache.authHeaders;
    const headers = {
      'Accept': 'application/json, text/plain, */*',
      'Authorization': 'Bearer ' + CONFIG.token,
      'X-Requested-With': 'XMLHttpRequest',
      'CP-LANG': 'en',
      'CP-MODE': 'desktop'
    };
    setCache('authHeaders', headers);
    return headers;
  }

  function getBaseUrl() {
    if (isCacheValid('baseUrl')) return cache.baseUrl;
    const url = CONFIG.base + '/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId=' + CONFIG.clubId + '&zoneTypeId=' + CONFIG.zoneType + '&date=' + getOpenDate() + '&startDate=' + CONFIG.startTime;
    setCache('baseUrl', url);
    return url;
  }

  async function fetchWithRetry(url, options, retries) {
    retries = retries || 1;
    try {
      const response = await fetch(url, options);
      if (response.status === 429) {
        stats.rateLimited++;
        await delay(1000);
        if (retries > 0) return fetchWithRetry(url, options, retries - 1);
        return response;
      }
      return response;
    } catch (err) {
      if (retries > 0) {
        await delay(500);
        return fetchWithRetry(url, options, retries - 1);
      }
      throw err;
    }
  }

  async function syncServerClock() {
    for (let i = 1; i <= CONFIG.serverClockRetries; i++) {
      try {
        const t0 = now();
        const response = await fetchWithRetry(getBaseUrl(), {
          credentials: 'include',
          headers: getAuthHeaders(),
          mode: 'cors'
        });
        const t1 = now();
        const dateHeader = response.headers.get('date') || response.headers.get('Date');
        if (dateHeader) {
          serverClockOffset = new Date(dateHeader).getTime() - (t0 + (t1 - t0) / 2);
          clockSynced = true;
          console.log('[OK] Clock synced. Offset: ' + serverClockOffset + 'ms');
          return true;
        }
      } catch (err) {
        console.warn('Clock sync attempt ' + i + ' failed: ' + err.message);
      }
      await delay(300);
    }
    console.warn('[WARN] Could not sync clock');
    return false;
  }

  async function fetchZones() {
    try {
      const response = await fetchWithRetry(getBaseUrl(), {
        credentials: 'include',
        headers: getAuthHeaders()
      });
      if (!response.ok) {
        console.warn('Fetch zones failed: ' + response.status);
        return null;
      }
      const data = await response.json();
      const zones = (data.Data && data.Data.Zones) ? data.Data.Zones : [];
      if (!zones.length) return null;
      zones.sort((a, b) => {
        const numA = parseInt((a.Name.match(/\\d+$/) || ['0'])[0]) || 0;
        const numB = parseInt((b.Name.match(/\\d+$/) || ['0'])[0]) || 0;
        return numB - numA;
      });
      return zones;
    } catch (err) {
      console.error('Error fetching zones:', err);
      return null;
    }
  }

  async function buildSession(zone) {
    try {
      const response1 = await fetchWithRetry(getBaseUrl(), {
        credentials: 'include',
        headers: getAuthHeaders()
      });
      if (!response1.ok) return null;

      const sessionId = response1.headers.get('cp-buy-product-before-booking-fb-session-id');
      if (!sessionId) return null;

      const headers = {
        'Content-Type': 'application/json;charset=utf-8',
        'Accept': 'application/json, text/plain, */*',
        'Authorization': 'Bearer ' + CONFIG.token,
        'X-Hash': '#/FacilityBooking?clubId=' + CONFIG.clubId + '&zoneTypeId=' + CONFIG.zoneType + '&date=' + CONFIG.slotDate,
        'BAF-WIZARD-CURRENTURL': CONFIG.base + '/#/FacilityBooking?clubId=' + CONFIG.clubId + '&zoneTypeId=' + CONFIG.zoneType + '&date=' + CONFIG.slotDate + '&sessionId=' + sessionId,
        'CP-BUY-PRODUCT-BEFORE-BOOKING-FB-SESSION-ID': sessionId,
        'X-Requested-With': 'XMLHttpRequest',
        'CP-LANG': 'en',
        'CP-MODE': 'desktop'
      };

      const body = JSON.stringify({
        UserId: CONFIG.userId,
        ZoneId: zone.Id,
        StartTime: CONFIG.startTime,
        RequiredNumberOfSlots: null,
        Duration: CONFIG.duration
      });

      const response2 = await fetchWithRetry(CONFIG.base + '/FacilityBookings/WizardSteps/SetFacilityBookingDetailsWizardStep/Next', {
        method: 'POST',
        credentials: 'include',
        headers: headers,
        body: body
      });

      if (!response2.ok) return null;

      return { sessionId, zoneId: zone.Id, zone };
    } catch (err) {
      console.warn('Build session failed for zone ' + zone.Id + ':', err.message);
      return null;
    }
  }

  async function refreshPool() {
    try {
      if (!availableZones) {
        availableZones = await fetchZones();
        if (!availableZones) {
          console.log('[ERR] No zones available');
          return;
        }
        console.log('[OK] Courts: ' + availableZones.map(z => z.Name).join(', '));
      }

      // Store functions, not promises - to control when builds start
      const buildFns = [];
      for (let i = 0; i < availableZones.length; i++) {
        for (let j = 0; j < CONFIG.sessionsPerCourt; j++) {
          const zone = availableZones[i];
          buildFns.push(() => buildSession(zone));
        }
      }

      // Process in batches with proper concurrency control
      const results = [];
      const batchSize = CONFIG.maxConcurrency;
      
      for (let i = 0; i < buildFns.length; i += batchSize) {
        // Delay between batches to reduce rate limiting
        if (i > 0) {
          await delay(200);
        }
        
        const batch = buildFns.slice(i, i + batchSize);
        const batchPromises = batch.map(fn => fn());
        const batchResults = await Promise.all(batchPromises);
        
        for (const result of batchResults) {
          if (result) results.push(result);
        }
      }

      sessionPool = results;
      originalPoolCount = sessionPool.length;
      console.log('[OK] Pool: ' + sessionPool.length + '/' + (availableZones.length * CONFIG.sessionsPerCourt) + ' sessions');
    } catch (err) {
      console.error('Error refreshing pool:', err);
    }
  }

  async function tryStep3(session) {
    if (booked) return false;

    const headers = {
      'Content-Type': 'application/json;charset=utf-8',
      'Accept': 'application/json, text/plain, */*',
      'Authorization': 'Bearer ' + CONFIG.token,
      'X-Hash': '#/FacilityBooking?clubId=' + CONFIG.clubId + '&zoneTypeId=' + CONFIG.zoneType + '&date=' + CONFIG.slotDate,
      'BAF-WIZARD-CURRENTURL': CONFIG.base + '/#/FacilityBooking?clubId=' + CONFIG.clubId + '&zoneTypeId=' + CONFIG.zoneType + '&date=' + CONFIG.slotDate + '&sessionId=' + session.sessionId,
      'CP-BUY-PRODUCT-BEFORE-BOOKING-FB-SESSION-ID': session.sessionId,
      'X-Requested-With': 'XMLHttpRequest',
      'CP-LANG': 'en',
      'CP-MODE': 'desktop'
    };

    const body = JSON.stringify({
      ruleId: CONFIG.ruleId,
      OtherCalendarEventBookedAtRequestedTime: false,
      HasUserRequiredProducts: false
    });

    try {
      const response = await fetchWithRetry(CONFIG.base + '/FacilityBookings/WizardSteps/ChooseBookingRuleStep/Next', {
        method: 'POST',
        credentials: 'include',
        headers: headers,
        body: body
      });

      stats.totalSent++;

      if (response.status === 429) {
        stats.rateLimited++;
        return false;
      }

      if (!response.ok) {
        stats.totalFail++;
        return false;
      }

      const data = await response.json();

      if (data.Redirect || (data.Data && data.Data.Booked)) {
        stats.totalOk++;
        booked = true;
        console.log('[BOOKED!] Court: ' + (session.zone ? session.zone.Name : ''));
        console.log('Stats: ' + stats.totalSent + ' sent, ' + stats.totalOk + ' ok, ' + stats.totalFail + ' fail, ' + stats.rateLimited + ' rate-limited');
        releaseWakeLock();
        if (data.Redirect) {
          console.log('Payment: ' + data.Redirect);
          window.location.href = data.Redirect;
        }
        return true;
      }

      return false;
    } catch (err) {
      stats.totalFail++;
      console.warn('Step 3 failed:', err.message);
      return false;
    }
  }

  async function poolSalvo() {
    if (booked) return false;

    const requests = [];
    for (let i = 0; i < sessionPool.length; i++) {
      for (let j = 0; j < CONFIG.parallelShots; j++) {
        requests.push(() => tryStep3(sessionPool[i]));
      }
    }

    // Process in batches
    for (let i = 0; i < requests.length; i += CONFIG.maxConcurrency) {
      if (booked) return true;
      const batch = requests.slice(i, i + CONFIG.maxConcurrency);
      const results = await Promise.all(batch.map(fn => fn()))
      if (results.some(r => r)) return true;
    }

    return false;
  }

  function shouldRebuild() {
    if (originalPoolCount === 0) return false;
    return sessionPool.length < originalPoolCount * CONFIG.poolLowThreshold;
  }

  function releaseWakeLock() {
    if (wakeLock) {
      wakeLock.release().catch(() => {});
      wakeLock = null;
    }
  }

  async function fireBlitz() {
    clearInterval(keepaliveTimer);
    keepaliveTimer = null;

    console.log('[FIRING] ' + sessionPool.length + ' sessions x ' + CONFIG.parallelShots + ' = ' + (sessionPool.length * CONFIG.parallelShots) + ' per wave');

    const deadline = CONFIG.openAtMs + serverClockOffset + CONFIG.retryDurationMs;

    fireInterval = setInterval(() => {
      if (booked) { clearInterval(fireInterval); return; }
      if (!shouldRebuild()) {
        (async () => {
          try {
            availableZones = null;
            await refreshPool();
          } catch (err) {
            console.warn('Pool refresh failed:', err.message);
          }
        })();
      }
    }, CONFIG.keepaliveMs);

    function fireWave() {
      if (booked || now() > deadline) {
        clearInterval(fireInterval);
        return;
      }
      stats.waveCount++;
      if (stats.rateLimited > 5 && stats.waveCount % 5 === 0) {
        console.warn('[RATE] ' + stats.rateLimited + ' rate-limited responses detected');
      }
      console.log('[WAVE] #' + stats.waveCount + (shouldRebuild() ? ' (pool low)' : ''));
      poolSalvo().catch(err => {
        console.warn('Wave error:', err.message);
      });
      setTimeout(fireWave, CONFIG.waveIntervalMs);
    }

    fireWave();

    await new Promise(resolve => {
      const check = setInterval(() => {
        if (booked || now() > deadline) {
          clearInterval(check);
          clearInterval(fireInterval);
          releaseWakeLock();
          resolve();
        }
      }, 10);
    });

    if (!booked) {
      console.error('[FAIL] No court after ' + (CONFIG.retryDurationMs / 1000) + 's | Waves: ' + stats.waveCount + ' | Sent: ' + stats.totalSent + ' | OK: ' + stats.totalOk + ' | Fail: ' + stats.totalFail + ' | Rate-limited: ' + stats.rateLimited);
      if (stats.totalFail > stats.totalOk && stats.totalFail > 0) console.warn('[WARN] High failure rate - check network, token, or rate limiting');
      if (stats.rateLimited > stats.totalFail) console.warn('[WARN] Heavy rate limiting - consider reducing parallelShots or increasing waveIntervalMs');
    }
  }

  async function prewarm() {
    console.log('[OK] Pre-warming...');
    for (let i = 0; i < CONFIG.warmupRequests; i++) {
      try {
        await fetchWithRetry(getBaseUrl(), {
          credentials: 'include',
          headers: getAuthHeaders()
        });
      } catch (err) {
        // Ignore warmup errors
      }
      await delay(100);
    }
  }

  async function measureLatency() {
    const times = [];
    for (let i = 0; i < 3; i++) {
      const start = performance.now();
      try {
        await fetchWithRetry(getBaseUrl(), {
          credentials: 'include',
          headers: getAuthHeaders(),
          mode: 'cors'
        });
      } catch (err) {
        continue;
      }
      times.push(performance.now() - start);
    }

    if (times.length > 0) {
      measuredLatency = times.reduce((sum, t) => sum + t, 0) / times.length;
    } else {
      measuredLatency = 200;
    }

    console.log('[OK] Measured latency: ' + Math.round(measuredLatency) + 'ms');
  }

  function countdown() {
    const ms = (CONFIG.openAtMs + serverClockOffset) - now();
    const fireWindow = Math.max(measuredLatency * 3, 2000);

    if (ms <= (fireWindow + 1500) && !preRebuilt) {
      preRebuilt = true;
      console.log('[OK] Pre-rebuilding fresh sessions...');
      (async () => {
        try {
          availableZones = null;
          await refreshPool();
          console.log('[OK] Pre-rebuild complete: ' + sessionPool.length + ' sessions');
        } catch (err) {
          console.warn('[WARN] Pre-rebuild failed:', err.message);
        }
      })();
    }

    if (ms <= fireWindow) {
      console.log('[FIRING] Early window: ' + Math.round(fireWindow) + 'ms');
      clearInterval(countdownTimer);
      fireBlitz();
      return;
    }

    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    const msg = '[TIMER] ' + pad(h) + 'h ' + pad(m) + 'm ' + pad(s) + 's' + (clockSynced ? ' (synced)' : '');

    if (ms < 60000) console.log(msg);
    else if (ms < 300000) console.info(msg);

    const interval = ms > 300000 ? 30000 : (ms > 60000 ? 10000 : (ms > 10000 ? 1000 : 100));
    clearInterval(countdownTimer);
    countdownTimer = setTimeout(countdown, interval);
  }

  function cleanup() {
    clearInterval(keepaliveTimer);
    clearInterval(countdownTimer);
    clearInterval(fireInterval);
    releaseWakeLock();
  }

  async function main() {
    console.log('==============================');
    console.log('[OK] KALLANG BOOKER v8.1 FIXED');
    console.log('[OK] ' + CONFIG.slotDate + ' ' + CONFIG.startTime.slice(11, 16) + ' | User ' + CONFIG.userId + ' | Rule ' + CONFIG.ruleId + ' | ' + CONFIG.duration + 'min');
    console.log('[OK] Syncing clock...');

    await syncServerClock();

    console.log('[OK] Measuring server latency...');
    await measureLatency();

    await prewarm();

    console.log('[OK] Building pool (' + CONFIG.sessionsPerCourt + ' per court)...');

    let poolBuilt = false;
    for (let i = 1; i <= 3; i++) {
      await refreshPool();
      if (sessionPool.length) {
        poolBuilt = true;
        break;
      }
      console.warn('[WARN] Attempt ' + i + ' failed, retry in 2s...');
      await delay(2000);
    }

    if (!poolBuilt) {
      console.error('[ERR] Setup failed - could not build session pool');
      cleanup();
      return;
    }

    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        console.log('[OK] Wake lock acquired');
        wakeLock.addEventListener('release', () => {
          if (!booked) {
            (async () => {
              if (!('wakeLock' in navigator)) return;
              try {
                wakeLock = await navigator.wakeLock.request('screen');
              } catch (err) {
                console.warn('Failed to reacquire wake lock:', err.message);
              }
            })();
          }
        });
      } catch (err) {
        console.warn('[WARN] Wake lock failed:', err.message);
      }
    }

    const openTime = CONFIG.openAtMs + serverClockOffset;
    const timeLeft = openTime - now();

    if (timeLeft <= CONFIG.prefireMs) {
      console.log('[FIRING] Window open - NOW!');
      await fireBlitz();
    } else {
      const hours = Math.floor(timeLeft / 3600000);
      const mins = Math.floor((timeLeft % 3600000) / 60000);
      console.log('[OK] Armed! Opens in ' + hours + 'h ' + mins + 'm');
      console.log('[OK] Pool: ' + sessionPool.length + ' sessions | Refresh: ' + (CONFIG.keepaliveMs / 1000) + 's');

      keepaliveTimer = setInterval(() => {
        if (booked || (openTime - now() < 5000)) {
          clearInterval(keepaliveTimer);
          return;
        }
        if (!shouldRebuild()) {
          (async () => {
            try {
              availableZones = null;
              await refreshPool();
            } catch (err) {
              console.warn('Keepalive refresh failed:', err.message);
            }
          })();
        }
      }, CONFIG.keepaliveMs);

      countdown();
    }
  }

  window.addEventListener('error', (err) => {
    console.error('[ERR] Unhandled error:', err.message);
    cleanup();
  });

  main().catch(err => {
    console.error('[ERR] Main error:', err);
    cleanup();
  });

  return {
    cleanup: cleanup
  };
})();`
    }

    function copyScript() {
      if (!generatedScript) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedScript).then(() => {
          el('copy-btn').textContent = 'Copied!';
          setTimeout(() => { el('copy-btn').textContent = 'Copy Script'; }, 2000);
        }).catch(() => fallbackCopy());
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = generatedScript;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      el('copy-btn').textContent = 'Copied!';
      setTimeout(() => { el('copy-btn').textContent = 'Copy Script'; }, 2000);
    }

    function reset() {
      generatedScript = '';
      el('setup-screen').classList.remove('hidden');
      el('run-screen').classList.remove('show');
    }

    el('generate-btn').addEventListener('click', generate);
    el('copy-btn').addEventListener('click', copyScript);
    document.querySelector('#run-screen .btn-secondary').addEventListener('click', reset);
    el('date').addEventListener('input', updateOpens);
    el('time').addEventListener('input', updateOpens);

    window.addEventListener('DOMContentLoaded', () => {
      ['date', 'time', 'userId', 'ruleId', 'duration', 'token'].forEach(id => {
        const v = localStorage.getItem('kb_' + id);
        if (v) el(id).value = v;
      });
      setDateMin();
      updateOpens();
    });
})();
  </script>
