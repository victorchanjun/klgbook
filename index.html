<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booker">
  <title>Kallang Booker</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon-192.svg">
  <style>
    :root {
      --bg:       #0a1628;
      --surface:  #111f38;
      --border:   #1e3255;
      --green:    #1D9E75;
      --green-dk: #0F6E56;
      --green-lt: #9FE1CB;
      --green-bg: #0b2a20;
      --amber:    #f59e0b;
      --red:      #ef4444;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --mono:     'JetBrains Mono', 'Fira Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
      max-width: 480px;
      margin: 0 auto;
    }

    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .header-icon { font-size: 30px; line-height: 1; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .card-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      color: var(--text); font-size: 15px; font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); }
    .field textarea { font-family: var(--mono); font-size: 11px; min-height: 76px; resize: none; line-height: 1.6; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .opens-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 12px; font-family: var(--mono); color: var(--green-lt); margin-top: 10px;
    }
    .opens-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    .btn-primary {
      width: 100%; padding: 15px; background: var(--green); color: white;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
      -webkit-appearance: none; letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:active { background: var(--green-dk); transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      width: 100%; padding: 13px; background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 12px; font-size: 14px;
      cursor: pointer; margin-top: 8px; -webkit-appearance: none;
    }
    .btn-secondary:active { border-color: var(--red); color: var(--red); }

    #run-screen { display: none; }
    #run-screen.show { display: block; }
    #setup-screen.hidden { display: none; }

    .script-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-family: var(--mono); font-size: 10px; color: var(--green-lt);
      line-height: 1.5; word-break: break-all; max-height: 120px; overflow-y: auto;
      margin-bottom: 10px; user-select: all;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🏸</div>
    <div>
      <div class="header-title">Kallang Booker</div>
      <div class="header-sub">Auto-book badminton courts</div>
    </div>
  </div>

  <div id="setup-screen">
    <div class="card">
      <div class="card-label">Target Slot</div>
      <div class="grid2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="date" oninput="updateOpens()">
        </div>
        <div class="field">
          <label>Time</label>
          <input type="time" id="time" value="07:00" oninput="updateOpens()">
        </div>
      </div>
      <div class="opens-pill">
        <span class="dot"></span>
        <span id="opens-text">Select date and time</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Account</div>
      <div class="grid2">
        <div class="field">
          <label>User ID</label>
          <input type="number" id="userId" value="62061" inputmode="numeric">
        </div>
        <div class="field">
          <label>Rule ID</label>
          <input type="number" id="ruleId" value="19" inputmode="numeric">
        </div>
      </div>
      <div class="field">
        <label>Duration (min)</label>
        <select id="duration">
          <option value="60">60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Bearer Token</div>
      <div class="field">
        <label>JWT — no "Bearer " prefix</label>
        <textarea id="token" placeholder="eyJhbGci..." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
    </div>

    <button class="btn-primary" id="generate-btn" onclick="generate()">Generate &amp; Copy Script</button>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px;">
      Then open <strong style="color:var(--text)">thekallang.perfectgym.com</strong>, open DevTools console, paste &amp; run.
    </p>
  </div>

  <div id="run-screen">
    <div class="card">
      <div class="card-label">Script ready</div>
      <div class="script-box" id="script-preview"></div>
      <button class="btn-primary" id="copy-btn" onclick="copyScript()">Copy Script</button>
      <a id="open-btn" class="btn-primary" style="margin-top:8px;background:var(--green-dk)"
         href="https://thekallang.perfectgym.com/clientportal2/#/FacilityBooking"
         target="_blank" rel="noopener">Open Kallang →</a>
      <button class="btn-secondary" onclick="reset()">← Back</button>
    </div>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;">
      Paste into the browser console on the Kallang tab. Keep the tab open.
    </p>
  </div>

  <script>
(function () {
    'use strict';
    let generatedScript = '';

    function setDateMin() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth()+1).padStart(2,'0');
      const d = String(today.getDate()).padStart(2,'0');
      document.getElementById('date').min = y + '-' + m + '-' + d;
    }

    function updateOpens() {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const el   = document.getElementById('opens-text');
      if (!date || !time) { el.textContent = 'Select date and time'; return; }
      const openMs = new Date(date + 'T' + time + ':00').getTime() - 168 * 3600000;
      el.textContent = 'Opens: ' + new Date(openMs).toLocaleString('en-SG', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function generate() {
      const date     = document.getElementById('date').value;
      const time     = document.getElementById('time').value;
      const userId   = document.getElementById('userId').value;
      const ruleId   = document.getElementById('ruleId').value;
      const duration = document.getElementById('duration').value;
      const token    = document.getElementById('token').value.trim();

      if (!date || !time || !token) { alert('Fill in date, time, and token'); return; }

      ['date','time','userId','ruleId','duration','token'].forEach(function(id) {
        localStorage.setItem('kb_' + id, document.getElementById(id).value);
      });

      var startTime = date + 'T' + time + ':00';
      var openMs    = new Date(startTime).getTime() - 168 * 3600000;

      generatedScript =
"(async function() {
  'use strict';
  var OPEN_AT_MS = " + openMs + ";
  var START_TIME = '" + startTime + "';
  var SLOT_DATE = '" + date + "';
  var USER_ID = " + userId + ";
  var RULE_ID = " + ruleId + ";
  var DURATION = " + duration + ";
  var TOKEN = '" + token.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'\\r') + "';
  var BASE = 'https://thekallang.perfectgym.com/clientportal2';
  var CLUB_ID = 1;
  var ZONE_TYPE = 31;
  var RETRY_DURATION_MS = 300 * 1000;
  var PARALLEL_SHOTS = 3;
  var WAVE_INTERVAL_MS = 20;
  var KEEPALIVE_MS = 5000;
  var SESSIONS_PER_COURT = 5;
  var SERVER_CLOCK_RETRIES = 8;
  var PREFIRE_MS = 3000;
  var POOL_LOW_THRESHOLD = 0.3;
  var sessionPool = [], booked = false, keepaliveTimer = null, wakeLock = null;
  var serverClockOffset = 0, clockSynced = false;
  var waveCount = 0, totalSent = 0, totalOk = 0, totalFail = 0, rateLimited = 0;
  var measuredLatency = 0;
  var originalPoolCount = 0;
  var availableZones = null;
  var preRebuilt = false;

  function pad(n) { return String(Math.floor(n)).padStart(2,'0'); }

  function getOpenDate() {
    var d = new Date(OPEN_AT_MS + serverClockOffset);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function authHeaders() {
    return {'Accept':'application/json, text/plain, */*','Authorization':'Bearer '+TOKEN,'X-Requested-With':'XMLHttpRequest','CP-LANG':'en','CP-MODE':'desktop'};
  }

  async function syncServerClock() {
    for (var i = 1; i <= SERVER_CLOCK_RETRIES; i++) {
      try {
        var t0 = Date.now();
        var r = await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders(),mode:'cors'});
        var t1 = Date.now();
        var sd = r.headers.get('date')||r.headers.get('Date');
        if (sd) { serverClockOffset = new Date(sd).getTime()-(t0+(t1-t0)/2); clockSynced=true; console.log('[OK] Clock synced. Offset: '+serverClockOffset+'ms'); return true; }
      } catch(e) { console.warn('Clock sync attempt '+i+' failed'); }
      await new Promise(function(r){setTimeout(r,500)});
    }
    console.warn('[WARN] Could not sync clock'); return false;
  }

  async function fetchZones() {
    var r = await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders()});
    if (!r.ok) return null;
    var d = await r.json();
    var z = (d.Data&&d.Data.Zones)?d.Data.Zones:[];
    if (!z.length) return null;
    z.sort(function(a,b){return (parseInt((b.Name.match(/\\d+$/)||['0'])[0])||0)-(parseInt((a.Name.match(/\\d+$/)||['0'])[0])||0);});
    return z;
  }

  async function buildSession(zone) {
    try {
      var r1 = await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders()});
      if (!r1.ok) return null;
      var sid = r1.headers.get('cp-buy-product-before-booking-fb-session-id');
      if (!sid) return null;
      var h = {'Content-Type':'application/json;charset=utf-8','Accept':'application/json, text/plain, */*','Authorization':'Bearer '+TOKEN,'X-Hash':'#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE,'BAF-WIZARD-CURRENTURL':BASE+'/#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE+'&sessionId='+sid,'CP-BUY-PRODUCT-BEFORE-BOOKING-FB-SESSION-ID':sid,'X-Requested-With':'XMLHttpRequest','CP-LANG':'en','CP-MODE':'desktop'};
      var r2 = await fetch(BASE+'/FacilityBookings/WizardSteps/SetFacilityBookingDetailsWizardStep/Next',{method:'POST',credentials:'include',headers:h,body:JSON.stringify({UserId:USER_ID,ZoneId:zone.Id,StartTime:START_TIME,RequiredNumberOfSlots:null,Duration:DURATION})});
      if (!r2.ok) return null;
      return {sessionId:sid,zoneId:zone.Id,zone:zone};
    } catch(_) { return null; }
  }

  async function refreshPool() {
    if (!availableZones) {
      availableZones = await fetchZones();
      if (!availableZones) { console.log('[ERR] No zones'); return; }
      console.log('[OK] Courts: '+availableZones.map(function(z){return z.Name}).join(', '));
    }
    var builds = [];
    for (var i = 0; i < availableZones.length; i++) {
      for (var j = 0; j < SESSIONS_PER_COURT; j++) {
        builds.push(buildSession(availableZones[i]));
      }
    }
    var res = await Promise.all(builds);
    sessionPool = res.filter(function(x){return x});
    originalPoolCount = sessionPool.length;
    console.log('[OK] Pool: '+sessionPool.length+'/'+(availableZones.length*SESSIONS_PER_COURT)+' sessions');
  }

  async function tryStep3(sess) {
    if (booked) return false;
    var h = {'Content-Type':'application/json;charset=utf-8','Accept':'application/json, text/plain, */*','Authorization':'Bearer '+TOKEN,'X-Hash':'#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE,'BAF-WIZARD-CURRENTURL':BASE+'/#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE+'&sessionId='+sess.sessionId,'CP-BUY-PRODUCT-BEFORE-BOOKING-FB-SESSION-ID':sess.sessionId,'X-Requested-With':'XMLHttpRequest','CP-LANG':'en','CP-MODE':'desktop'};
    try {
      var res = await fetch(BASE+'/FacilityBookings/WizardSteps/ChooseBookingRuleStep/Next',{method:'POST',credentials:'include',headers:h,body:JSON.stringify({ruleId:RULE_ID,OtherCalendarEventBookedAtRequestedTime:false,HasUserRequiredProducts:false})});
      totalSent++;
      if (res.status === 429) { rateLimited++; return false; }
      if (!res.ok) { totalFail++; return false; }
      var d = await res.json();
      if (d.Redirect||(d.Data&&d.Data.Booked)) {
        totalOk++; booked = true;
        console.log('[BOOKED!] Court: '+(sess.zone?sess.zone.Name:''));
        console.log('Stats: '+totalSent+' sent, '+totalOk+' ok, '+totalFail+' fail, '+rateLimited+' rate-limited');
        releaseWakeLock();
        if (d.Redirect) {
          console.log('Payment: '+d.Redirect);
          window.location.href = d.Redirect;
        }
        return true;
      }
      return false;
    } catch(_) { totalFail++; return false; }
  }

  function poolSalvo() {
    if (booked) return Promise.resolve(false);
    var requests = [];
    for (var i = 0; i < sessionPool.length; i++) {
      for (var j = 0; j < PARALLEL_SHOTS; j++) {
        requests.push(tryStep3(sessionPool[i]));
      }
    }
    return Promise.all(requests).then(function(r){return r.some(function(x){return x});});
  }

  function shouldRebuild() {
    if (originalPoolCount === 0) return false;
    return sessionPool.length < originalPoolCount * POOL_LOW_THRESHOLD;
  }

  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }
  }

  async function fireBlitz() {
    if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null; }
    console.log('[FIRING] '+sessionPool.length+' sessions x '+PARALLEL_SHOTS+' = '+(sessionPool.length*PARALLEL_SHOTS)+' per wave');
    var deadline = OPEN_AT_MS + serverClockOffset + RETRY_DURATION_MS;
    var frt = setInterval(function() {
      if (booked) { clearInterval(frt); return; }
      if (!shouldRebuild()) {
        (async function() { try { availableZones = null; await refreshPool(); } catch(e) {} })();
      }
    }, KEEPALIVE_MS);
    function fireWave() {
      if (booked || Date.now() > deadline) { clearInterval(frt); return; }
      waveCount++;
      if (rateLimited > 5 && waveCount % 5 === 0) {
        console.warn('[RATE] '+rateLimited+' rate-limited responses detected, slowing down');
      }
      console.log('[WAVE] #' + waveCount + (shouldRebuild() ? ' (pool low)' : ''));
      poolSalvo().catch(function(){});
      setTimeout(fireWave, WAVE_INTERVAL_MS);
    }
    fireWave();
    await new Promise(function(resolve) {
      var c = setInterval(function() {
        if (booked || Date.now() > deadline) { clearInterval(c); clearInterval(frt); resolve(); }
      }, 10);
    });
    releaseWakeLock();
    if (!booked) {
      console.error('[FAIL] No court after '+(RETRY_DURATION_MS/1000)+'s | Waves: '+waveCount+' | Sent: '+totalSent+' | OK: '+totalOk+' | Fail: '+totalFail+' | Rate-limited: '+rateLimited);
      if (totalFail > totalOk && totalFail > 0) console.warn('[WARN] High failure rate - check network, token, or rate limiting');
      if (rateLimited > totalFail) console.warn('[WARN] Heavy rate limiting - consider reducing PARALLEL_SHOTS or increasing WAVE_INTERVAL_MS');
    }
  }

  async function prewarm() {
    console.log('[OK] Pre-warming...');
    var reqs = [];
    for (var i = 0; i < 12; i++) {
      reqs.push(fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders()}));
    }
    await Promise.all(reqs.map(function(f){return f.catch(function(){});}));
    console.log('[OK] Warmed');
  }

  async function measureLatency() {
    var start = performance.now();
    try { await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders(),mode:'cors'}); } catch(e) {}
    var latency = performance.now() - start;
    var total = 0;
    for (var i = 0; i < 2; i++) {
      var s = performance.now();
      try { await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders(),mode:'cors'}); } catch(e) {}
      total += performance.now() - s;
    }
    measuredLatency = (latency + total / 2);
    console.log('[OK] Measured latency: ' + Math.round(measuredLatency) + 'ms');
    return measuredLatency;
  }

  function countdown() {
    var ms = (OPEN_AT_MS + serverClockOffset) - Date.now();
    var fireWindow = Math.max(measuredLatency * 3, 1500);
    if (ms <= (fireWindow + 1000) && !preRebuilt) {
      preRebuilt = true;
      console.log('[OK] Pre-rebuilding fresh sessions...');
      (async function() {
        try {
          availableZones = null;
          await refreshPool();
          console.log('[OK] Pre-rebuild complete: ' + sessionPool.length + ' sessions');
        } catch(e) { console.warn('[WARN] Pre-rebuild failed'); }
      })();
    }
    if (ms <= fireWindow) {
      console.log('[FIRING] Early window: '+Math.round(fireWindow)+'ms');
      fireBlitz();
      return;
    }
    var h = Math.floor(ms / 3600000);
    var m = Math.floor((ms % 3600000) / 60000);
    var s = Math.floor((ms % 60000) / 1000);
    var msg = '[TIMER] ' + pad(h) + 'h ' + pad(m) + 'm ' + pad(s) + 's' + (clockSynced ? ' (synced)' : '');
    if (ms < 60000) console.log(msg);
    else if (ms < 300000) console.info(msg);
    setTimeout(countdown, ms > 300000 ? 30000 : (ms > 60000 ? 10000 : (ms > 10000 ? 1000 : 100)));
  }

  console.log('==============================');
  console.log('[OK] KALLANG BOOKER v5');
  console.log('[OK] '+SLOT_DATE+' '+START_TIME.slice(11,16)+' | User '+USER_ID+' | Rule '+RULE_ID+' | '+DURATION+'min');
  console.log('[OK] Syncing clock...');
  await syncServerClock();
  console.log('[OK] Measuring server latency...');
  await measureLatency();
  await prewarm();
  console.log('[OK] Building pool ('+SESSIONS_PER_COURT+' per court)...');
  var ok = false;
  for (var i = 1; i <= 5; i++) {
    await refreshPool();
    if (sessionPool.length) { ok = true; break; }
    console.warn('[WARN] Attempt '+i+' failed, retry in 3s...');
    await new Promise(function(r){setTimeout(r,3000)});
  }
  if (!ok) { console.error('[ERR] Setup failed'); return; }
  (async function() {
    if (!('wakeLock' in navigator)) return;
    try {
      wakeLock = await navigator.wakeLock.request('screen');
      console.log('[OK] Wake lock acquired');
      wakeLock.addEventListener('release', function() {
        if (!booked) {
          (async function(){
            if (!('wakeLock' in navigator)) return;
            try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}
          })();
        }
      });
    } catch(e) { console.warn('[WARN] Wake lock failed'); }
  })();
  var eo = OPEN_AT_MS + serverClockOffset;
  var ml = eo - Date.now();
  if (ml <= PREFIRE_MS) {
    console.log('[FIRING] Window open - NOW!');
    await fireBlitz();
  } else {
    var h2 = Math.floor(ml / 3600000);
    var m2 = Math.floor((ml % 3600000) / 60000);
    console.log('[OK] Armed! Opens in ' + h2 + 'h ' + m2 + 'm');
    console.log('[OK] Pool: '+sessionPool.length+' sessions | Refresh: '+(KEEPALIVE_MS/1000)+'s');
    keepaliveTimer = setInterval(function() {
      if (booked || (eo - Date.now() < 5000)) { clearInterval(keepaliveTimer); return; }
      if (!shouldRebuild()) {
        (async function() { try { availableZones = null; await refreshPool(); } catch(e) {} })();
      }
    }, KEEPALIVE_MS);
    countdown();
  }
})();
";

      document.getElementById('script-preview').textContent = generatedScript.slice(0, 300) + '...';
      document.getElementById('setup-screen').classList.add('hidden');
      document.getElementById('run-screen').classList.add('show');
      copyScript();
    }

    function copyScript() {
      if (!generatedScript) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedScript).then(function() {
          var btn = document.getElementById('copy-btn');
          btn.textContent = 'Copied!';
          setTimeout(function() { btn.textContent = 'Copy Script'; }, 2000);
        }).catch(function() { fallbackCopy(); });
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = generatedScript;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      var btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy Script'; }, 2000);
    }

    function reset() {
      generatedScript = '';
      document.getElementById('setup-screen').classList.remove('hidden');
      document.getElementById('run-screen').classList.remove('show');
    }

    window.addEventListener('DOMContentLoaded', function() {
      ['date','time','userId','ruleId','duration','token'].forEach(function(id) {
        var v = localStorage.getItem('kb_' + id);
        if (v) document.getElementById(id).value = v;
      });
      setDateMin();
      updateOpens();
    });

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').catch(function(){}); }

    window.setDateMin = setDateMin;
    window.updateOpens = updateOpens;
    window.generate = generate;
    window.copyScript = copyScript;
    window.reset = reset;
})();
  </script>
</body>
</html>
