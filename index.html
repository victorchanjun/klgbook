<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a1628">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Booker">
  <title>Kallang Booker Nuclear</title>
  <style>
    :root {
      --bg:       #0a1628;
      --surface:  #111f38;
      --border:   #1e3255;
      --green:    #1D9E75;
      --green-dk: #0F6E56;
      --green-lt: #9FE1CB;
      --red:      #ef4444;
      --amber:    #f59e0b;
      --text:     #e2e8f0;
      --muted:    #64748b;
      --mono:     'JetBrains Mono', 'Fira Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 28px);
      max-width: 480px;
      margin: 0 auto;
    }

    .header { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .header-icon { font-size: 30px; line-height: 1; }
    .header-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .header-sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
    .card-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }

    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
    .field:last-child { margin-bottom: 0; }
    .field label { font-size: 12px; color: var(--muted); font-weight: 500; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 11px 12px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
      color: var(--text); font-size: 15px; font-family: inherit;
      -webkit-appearance: none; appearance: none;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); }
    .field textarea { font-family: var(--mono); font-size: 11px; min-height: 76px; resize: none; line-height: 1.6; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .opens-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 8px 12px; font-size: 12px; font-family: var(--mono); color: var(--green-lt); margin-top: 10px;
    }
    .opens-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

    .btn-primary {
      width: 100%; padding: 15px; background: var(--green); color: white;
      border: none; border-radius: 12px; font-size: 15px; font-weight: 700;
      cursor: pointer; margin-top: 4px;
      -webkit-appearance: none; letter-spacing: 0.01em;
      transition: background 0.15s, transform 0.1s;
    }
    .btn-primary:active { background: var(--green-dk); transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-secondary {
      width: 100%; padding: 13px; background: none; border: 1px solid var(--border);
      color: var(--muted); border-radius: 12px; font-size: 14px;
      cursor: pointer; margin-top: 8px; -webkit-appearance: none;
    }
    .btn-secondary:active { border-color: var(--red); color: var(--red); }

    #run-screen { display: none; }
    #run-screen.show { display: block; }
    #setup-screen.hidden { display: none; }

    .script-box {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 12px; font-family: var(--mono); font-size: 10px; color: var(--green-lt);
      line-height: 1.5; word-break: break-all; max-height: 120px; overflow-y: auto;
      margin-bottom: 10px; user-select: all;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">🏸</div>
    <div>
      <div class="header-title">Kallang Booker</div>
      <div class="header-sub">Nuclear auto-booker</div>
    </div>
  </div>

  <div id="setup-screen">
    <div class="card">
      <div class="card-label">Target Slot</div>
      <div class="grid2">
        <div class="field">
          <label>Date</label>
          <input type="date" id="date">
        </div>
        <div class="field">
          <label>Time</label>
          <input type="time" id="time" value="07:00">
        </div>
      </div>
      <div class="opens-pill">
        <span class="dot"></span>
        <span id="opens-text">Select date and time</span>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Account</div>
      <div class="grid2">
        <div class="field">
          <label>User ID</label>
          <input type="number" id="userId" value="62061" inputmode="numeric">
        </div>
        <div class="field">
          <label>Rule ID</label>
          <input type="number" id="ruleId" value="19" inputmode="numeric">
        </div>
      </div>
      <div class="field">
        <label>Duration (min)</label>
        <select id="duration">
          <option value="60">60 minutes</option>
          <option value="90">90 minutes</option>
          <option value="120">120 minutes</option>
        </select>
      </div>
    </div>

    <div class="card">
      <div class="card-label">Bearer Token</div>
      <div class="field">
        <label>JWT — no "Bearer " prefix</label>
        <textarea id="token" placeholder="eyJhbGci..." autocomplete="off" autocorrect="off" spellcheck="false"></textarea>
      </div>
    </div>

    <button class="btn-primary" id="generate-btn">Generate &amp; Copy Script</button>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:10px;">
      Then open <strong style="color:var(--text)">thekallang.perfectgym.com</strong>, open DevTools console, paste &amp; run.
    </p>
  </div>

  <div id="run-screen">
    <div class="card">
      <div class="card-label">Script ready</div>
      <div class="script-box" id="script-preview"></div>
      <button class="btn-primary" id="copy-btn">Copy Script</button>
      <a id="open-btn" class="btn-primary" style="margin-top:8px;background:var(--green-dk)"
         href="https://thekallang.perfectgym.com/clientportal2/#/FacilityBooking"
         target="_blank" rel="noopener">Open Kallang →</a>
      <button class="btn-secondary">← Back</button>
    </div>
    <p style="font-size:11px;color:var(--muted);text-align:center;margin-top:4px;">
      Paste into the browser console on the Kallang tab. Keep the tab open.
    </p>
  </div>

  <script>
(function () {
    'use strict';
    let generatedScript = '';

    function setDateMin() {
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth()+1).padStart(2,'0');
      const d = String(today.getDate()).padStart(2,'0');
      document.getElementById('date').min = y + '-' + m + '-' + d;
    }

    function updateOpens() {
      const date = document.getElementById('date').value;
      const time = document.getElementById('time').value;
      const el   = document.getElementById('opens-text');
      if (!date || !time) { el.textContent = 'Select date and time'; return; }
      const openMs = new Date(date + 'T' + time + ':00').getTime() - 168 * 3600000;
      el.textContent = 'Opens: ' + new Date(openMs).toLocaleString('en-SG', {
        weekday: 'short', month: 'short', day: 'numeric',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }

    function generate() {
      try {
        const date     = document.getElementById('date').value;
        const time     = document.getElementById('time').value;
        const userId   = document.getElementById('userId').value;
        const ruleId   = document.getElementById('ruleId').value;
        const duration = document.getElementById('duration').value;
        const token    = document.getElementById('token').value.replace(/\r\n|\r|\n|\t/g,'').trim();

        if (!date || !time || !token) { alert('Fill in date, time, and token'); return; }
        if (token.length < 20) { alert('Token looks too short. Check your JWT.'); return; }

        ['date','time','userId','ruleId','duration','token'].forEach(function(id) {
          localStorage.setItem('kb_' + id, document.getElementById(id).value);
        });

        var startTime = date + 'T' + time + ':00';
        var openMs    = new Date(startTime).getTime() - 168 * 3600000;
        var tokenSafe = token.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

        generatedScript =
"(async function() {\n" +
"  'use strict';\n" +
"  var OPEN_AT_MS = " + openMs + ";\n" +
"  var START_TIME = '" + startTime + "';\n" +
"  var SLOT_DATE = '" + date + "';\n" +
"  var USER_ID = " + userId + ";\n" +
"  var RULE_ID = " + ruleId + ";\n" +
"  var DURATION = " + duration + ";\n" +
"  var TOKEN = '" + tokenSafe + "';\n" +
"  var BASE = 'https://thekallang.perfectgym.com/clientportal2';\n" +
"  var CLUB_ID = 1;\n" +
"  var ZONE_TYPE = 31;\n" +
"  var RETRY_DURATION_MS = 600 * 1000;\n" +
"  var PARALLEL_SHOTS = 8;\n" +
"  var WAVE_INTERVAL_MS = 5;\n" +
"  var KEEPALIVE_MS = 1500;\n" +
"  var SESSIONS_PER_COURT = 20;\n" +
"  var SERVER_CLOCK_RETRIES = 20;\n" +
"  var PREFIRE_MS = 15000;\n" +
"  var POOL_LOW_THRESHOLD = 0.15;\n" +
"  var sessionPool = [], booked = false, keepaliveTimer = null, wakeLock = null;\n" +
"  var serverClockOffset = 0, clockSynced = false;\n" +
"  var waveCount = 0, totalSent = 0, totalOk = 0, totalFail = 0, rateLimited = 0;\n" +
"  var measuredLatency = 0;\n" +
"  var originalPoolCount = 0;\n" +
"  var availableZones = null;\n" +
"  var preRebuilt = false;\n" +
"\n" +
"  function pad(n) { return String(Math.floor(n)).padStart(2,'0'); }\n" +
"\n" +
"  function getOpenDate() {\n" +
"    var d = new Date(OPEN_AT_MS + serverClockOffset);\n" +
"    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');\n" +
"  }\n" +
"\n" +
"  function authHeaders() {\n" +
"    return {'Accept':'application/json, text/plain, */*','Authorization':'***'+TOKEN,'X-Requested-With':'XMLHttpRequest','CP-LANG':'en','CP-MODE':'desktop'};\n" +
"  }\n" +
"\n" +
"  async function syncServerClock() {\n" +
"    for (var i = 1; i <= SERVER_CLOCK_RETRIES; i++) {\n" +
"      try {\n" +
"        var t0 = Date.now();\n" +
"        var r = await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders(),mode:'cors'});\n" +
"        var t1 = Date.now();\n" +
"        var sd = r.headers.get('date')||r.headers.get('Date');\n" +
"        if (sd) { serverClockOffset = new Date(sd).getTime()-(t0+(t1-t0)/2); clockSynced=true; console.log('[OK] Clock synced. Offset: '+serverClockOffset+'ms'); return true; }\n" +
"      } catch(e) { console.warn('Clock sync attempt '+i+' failed'); }\n" +
"      await new Promise(function(r){setTimeout(r,300)});\n" +
"    }\n" +
"    console.warn('[WARN] Could not sync clock'); return false;\n" +
"  }\n" +
"\n" +
"  async function fetchZones() {\n" +
"    var r = await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders()});\n" +
"    if (!r.ok) return null;\n" +
"    var d = await r.json();\n" +
"    var z = (d.Data&&d.Data.Zones)?d.Data.Zones:[];\n" +
"    if (!z.length) return null;\n" +
"    z.sort(function(a,b){return (parseInt((b.Name.match(/\\\\d+$/)||['0'])[0])||0)-(parseInt((a.Name.match(/\\\\d+$/)||['0'])[0])||0);});\n" +
"    return z;\n" +
"  }\n" +
"\n" +
"  async function buildSession(zone) {\n" +
"    try {\n" +
"      var r1 = await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders()});\n" +
"      if (!r1.ok) return null;\n" +
"      var sid = r1.headers.get('cp-buy-product-before-booking-fb-session-id');\n" +
"      if (!sid) return null;\n" +
"      var h = {'Content-Type':'application/json;charset=utf-8','Accept':'application/json, text/plain, */*','Authorization':'***'+TOKEN,'X-Hash':'#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE,'BAF-WIZARD-CURRENTURL':BASE+'/#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE+'&sessionId='+sid,'CP-BUY-PRODUCT-BEFORE-BOOKING-FB-SESSION-ID':sid,'X-Requested-With':'XMLHttpRequest','CP-LANG':'en','CP-MODE':'desktop'};\n" +
"      var r2 = await fetch(BASE+'/FacilityBookings/WizardSteps/SetFacilityBookingDetailsWizardStep/Next',{method:'POST',credentials:'include',headers:h,body:JSON.stringify({UserId:USER_ID,ZoneId:zone.Id,StartTime:START_TIME,RequiredNumberOfSlots:null,Duration:DURATION})});\n" +
"      if (!r2.ok) return null;\n" +
"      return {sessionId:sid,zoneId:zone.Id,zone:zone};\n" +
"    } catch(_) { return null; }\n" +
"  }\n" +
"\n" +
"  async function refreshPool() {\n" +
"    if (!availableZones) {\n" +
"      availableZones = await fetchZones();\n" +
"      if (!availableZones) { console.log('[ERR] No zones'); return; }\n" +
"      console.log('[OK] Courts: '+availableZones.map(function(z){return z.Name}).join(', '));\n" +
"    }\n" +
"    var builds = [];\n" +
"    for (var i = 0; i < availableZones.length; i++) {\n" +
"      for (var j = 0; j < SESSIONS_PER_COURT; j++) {\n" +
"        builds.push(buildSession(availableZones[i]));\n" +
"      }\n" +
"    }\n" +
"    var res = await Promise.all(builds);\n" +
"    sessionPool = res.filter(function(x){return x});\n" +
"    originalPoolCount = sessionPool.length;\n" +
"    console.log('[OK] Pool: '+sessionPool.length+'/'+(availableZones.length*SESSIONS_PER_COURT)+' sessions');\n" +
"  }\n" +
"\n" +
"  async function tryStep3(sess) {\n" +
"    if (booked) return false;\n" +
"    var h = {'Content-Type':'application/json;charset=utf-8','Accept':'application/json, text/plain, */*','Authorization':'***'+TOKEN,'X-Hash':'#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE,'BAF-WIZARD-CURRENTURL':BASE+'/#/FacilityBooking?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+SLOT_DATE+'&sessionId='+sess.sessionId,'CP-BUY-PRODUCT-BEFORE-BOOKING-FB-SESSION-ID':sess.sessionId,'X-Requested-With':'XMLHttpRequest','CP-LANG':'en','CP-MODE':'desktop'};\n" +
"    try {\n" +
"      var res = await fetch(BASE+'/FacilityBookings/WizardSteps/ChooseBookingRuleStep/Next',{method:'POST',credentials:'include',headers:h,body:JSON.stringify({ruleId:RULE_ID,OtherCalendarEventBookedAtRequestedTime:false,HasUserRequiredProducts:false})});\n" +
"      totalSent++;\n" +
"      if (res.status === 429) { rateLimited++; return false; }\n" +
"      if (!res.ok) { totalFail++; return false; }\n" +
"      var d = await res.json();\n" +
"      if (d.Redirect||(d.Data&&d.Data.Booked)) {\n" +
"        totalOk++; booked = true;\n" +
"        console.log('[BOOKED!] Court: '+(sess.zone?sess.zone.Name:''));\n" +
"        console.log('Stats: '+totalSent+' sent, '+totalOk+' ok, '+totalFail+' fail, '+rateLimited+' rate-limited');\n" +
"        releaseWakeLock();\n" +
"        if (d.Redirect) {\n" +
"          console.log('Payment: '+d.Redirect);\n" +
"          window.location.href = d.Redirect;\n" +
"        }\n" +
"        return true;\n" +
"      }\n" +
"      return false;\n" +
"    } catch(_) { totalFail++; return false; }\n" +
"  }\n" +
"\n" +
"  function poolSalvo() {\n" +
"    if (booked) return Promise.resolve(false);\n" +
"    var requests = [];\n" +
"    for (var i = 0; i < sessionPool.length; i++) {\n" +
"      for (var j = 0; j < PARALLEL_SHOTS; j++) {\n" +
"        requests.push(tryStep3(sessionPool[i]));\n" +
"      }\n" +
"    }\n" +
"    return Promise.all(requests).then(function(r){return r.some(function(x){return x});});\n" +
"  }\n" +
"\n" +
"  function shouldRebuild() {\n" +
"    if (originalPoolCount === 0) return false;\n" +
"    return sessionPool.length < originalPoolCount * POOL_LOW_THRESHOLD;\n" +
"  }\n" +
"\n" +
"  function releaseWakeLock() {\n" +
"    if (wakeLock) { wakeLock.release().catch(function(){}); wakeLock = null; }\n" +
"  }\n" +
"\n" +
"  async function fireBlitz() {\n" +
"    if (keepaliveTimer) { clearInterval(keepaliveTimer); keepaliveTimer = null; }\n" +
"    console.log('[FIRING] '+sessionPool.length+' sessions x '+PARALLEL_SHOTS+' = '+(sessionPool.length*PARALLEL_SHOTS)+' per wave');\n" +
"    var deadline = OPEN_AT_MS + serverClockOffset + RETRY_DURATION_MS;\n" +
"    var frt = setInterval(function() {\n" +
"      if (booked) { clearInterval(frt); return; }\n" +
"      if (!shouldRebuild()) {\n" +
"        (async function() { try { availableZones = null; await refreshPool(); } catch(e) {} })();\n" +
"      }\n" +
"    }, KEEPALIVE_MS);\n" +
"    function fireWave() {\n" +
"      if (booked || Date.now() > deadline) { clearInterval(frt); return; }\n" +
"      waveCount++;\n" +
"      if (rateLimited > 5 && waveCount % 5 === 0) {\n" +
"        console.warn('[RATE] '+rateLimited+' rate-limited responses detected');\n" +
"      }\n" +
"      console.log('[WAVE] #' + waveCount + (shouldRebuild() ? ' (pool low)' : ''));\n" +
"      poolSalvo().catch(function(){});\n" +
"      setTimeout(fireWave, WAVE_INTERVAL_MS);\n" +
"    }\n" +
"    fireWave();\n" +
"    await new Promise(function(resolve) {\n" +
"      var c = setInterval(function() {\n" +
"        if (booked || Date.now() > deadline) { clearInterval(c); clearInterval(frt); resolve(); }\n" +
"      }, 10);\n" +
"    });\n" +
"    releaseWakeLock();\n" +
"    if (!booked) {\n" +
"      console.error('[FAIL] No court after '+(RETRY_DURATION_MS/1000)+'s | Waves: '+waveCount+' | Sent: '+totalSent+' | OK: '+totalOk+' | Fail: '+totalFail+' | Rate-limited: '+rateLimited);\n" +
"      if (totalFail > totalOk && totalFail > 0) console.warn('[WARN] High failure rate - check network, token, or rate limiting');\n" +
"      if (rateLimited > totalFail) console.warn('[WARN] Heavy rate limiting - consider reducing PARALLEL_SHOTS or increasing WAVE_INTERVAL_MS');\n" +
"    }\n" +
"  }\n" +
"\n" +
"  async function prewarm() {\n" +
"    console.log('[OK] Pre-warming...');\n" +
"    var reqs = [];\n" +
"    for (var i = 0; i < 24; i++) {\n" +
"      reqs.push(fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders()}));\n" +
"    }\n" +
"    await Promise.all(reqs.map(function(f){return f.catch(function(){});}));\n" +
"    console.log('[OK] Warmed');\n" +
"  }\n" +
"\n" +
"  async function measureLatency() {\n" +
"    var start = performance.now();\n" +
"    try { await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders(),mode:'cors'}); } catch(e) {}\n" +
"    var latency = performance.now() - start;\n" +
"    var total = 0;\n" +
"    for (var i = 0; i < 2; i++) {\n" +
"      var s = performance.now();\n" +
"      try { await fetch(BASE+'/FacilityBookings/BuyProductBeforeBookingFacility/Start?clubId='+CLUB_ID+'&zoneTypeId='+ZONE_TYPE+'&date='+getOpenDate()+'&startDate='+START_TIME,{credentials:'include',headers:authHeaders(),mode:'cors'}); } catch(e) {}\n" +
"      total += performance.now() - s;\n" +
"    }\n" +
"    measuredLatency = (latency + total / 2);\n" +
"    console.log('[OK] Measured latency: ' + Math.round(measuredLatency) + 'ms');\n" +
"    return measuredLatency;\n" +
"  }\n" +
"\n" +
"  function countdown() {\n" +
"    var ms = (OPEN_AT_MS + serverClockOffset) - Date.now();\n" +
"    var fireWindow = Math.max(measuredLatency * 3, 2000);\n" +
"    if (ms <= (fireWindow + 1500) && !preRebuilt) {\n" +
"      preRebuilt = true;\n" +
"      console.log('[OK] Pre-rebuilding fresh sessions...');\n" +
"      (async function() {\n" +
"        try {\n" +
"          availableZones = null;\n" +
"          await refreshPool();\n" +
"          console.log('[OK] Pre-rebuild complete: ' + sessionPool.length + ' sessions');\n" +
"        } catch(e) { console.warn('[WARN] Pre-rebuild failed'); }\n" +
"      })();\n" +
"    }\n" +
"    if (ms <= fireWindow) {\n" +
"      console.log('[FIRING] Early window: '+Math.round(fireWindow)+'ms');\n" +
"      fireBlitz();\n" +
"      return;\n" +
"    }\n" +
"    var h = Math.floor(ms / 3600000);\n" +
"    var m = Math.floor((ms % 3600000) / 60000);\n" +
"    var s = Math.floor((ms % 60000) / 1000);\n" +
"    var msg = '[TIMER] ' + pad(h) + 'h ' + pad(m) + 'm ' + pad(s) + 's' + (clockSynced ? ' (synced)' : '');\n" +
"    if (ms < 60000) console.log(msg);\n" +
"    else if (ms < 300000) console.info(msg);\n" +
"    setTimeout(countdown, ms > 300000 ? 30000 : (ms > 60000 ? 10000 : (ms > 10000 ? 1000 : 100)));\n" +
"  }\n" +
"\n" +
"  console.log('==============================');\n" +
"  console.log('[OK] KALLANG BOOKER v7 NUCLEAR');\n" +
"  console.log('[OK] '+SLOT_DATE+' '+START_TIME.slice(11,16)+' | User '+USER_ID+' | Rule '+RULE_ID+' | '+DURATION+'min');\n" +
"  console.log('[OK] Syncing clock...');\n" +
"  await syncServerClock();\n" +
"  console.log('[OK] Measuring server latency...');\n" +
"  await measureLatency();\n" +
"  await prewarm();\n" +
"  console.log('[OK] Building pool ('+SESSIONS_PER_COURT+' per court)...');\n" +
"  var ok = false;\n" +
"  for (var i = 1; i <= 8; i++) {\n" +
"    await refreshPool();\n" +
"    if (sessionPool.length) { ok = true; break; }\n" +
"    console.warn('[WARN] Attempt '+i+' failed, retry in 2s...');\n" +
"    await new Promise(function(r){setTimeout(r,2000)});\n" +
"  }\n" +
"  if (!ok) { console.error('[ERR] Setup failed'); return; }\n" +
"  (async function() {\n" +
"    if (!('wakeLock' in navigator)) return;\n" +
"    try {\n" +
"      wakeLock = await navigator.wakeLock.request('screen');\n" +
"      console.log('[OK] Wake lock acquired');\n" +
"      wakeLock.addEventListener('release', function() {\n" +
"        if (!booked) {\n" +
"          (async function(){\n" +
"            if (!('wakeLock' in navigator)) return;\n" +
"            try { wakeLock = await navigator.wakeLock.request('screen'); } catch(e) {}\n" +
"          })();\n" +
"        }\n" +
"      });\n" +
"    } catch(e) { console.warn('[WARN] Wake lock failed'); }\n" +
"  })();\n" +
"  var eo = OPEN_AT_MS + serverClockOffset;\n" +
"  var ml = eo - Date.now();\n" +
"  if (ml <= PREFIRE_MS) {\n" +
"    console.log('[FIRING] Window open - NOW!');\n" +
"    await fireBlitz();\n" +
"  } else {\n" +
"    var h2 = Math.floor(ml / 3600000);\n" +
"    var m2 = Math.floor((ml % 3600000) / 60000);\n" +
"    console.log('[OK] Armed! Opens in ' + h2 + 'h ' + m2 + 'm');\n" +
"    console.log('[OK] Pool: '+sessionPool.length+' sessions | Refresh: '+(KEEPALIVE_MS/1000)+'s');\n" +
"    keepaliveTimer = setInterval(function() {\n" +
"      if (booked || (eo - Date.now() < 5000)) { clearInterval(keepaliveTimer); return; }\n" +
"      if (!shouldRebuild()) {\n" +
"        (async function() { try { availableZones = null; await refreshPool(); } catch(e) {} })();\n" +
"      }\n" +
"    }, KEEPALIVE_MS);\n" +
"    countdown();\n" +
"  }\n" +
"})();\n";

        document.getElementById('script-preview').textContent = generatedScript.slice(0, 300) + '...';
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('run-screen').classList.add('show');
        copyScript();
      } catch (err) {
        console.error('Generate error:', err);
        alert('Error generating script: ' + err.message);
      }
    }

    function copyScript() {
      if (!generatedScript) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(generatedScript).then(function() {
          var btn = document.getElementById('copy-btn');
          btn.textContent = 'Copied!';
          setTimeout(function() { btn.textContent = 'Copy Script'; }, 2000);
        }).catch(function() { fallbackCopy(); });
      } else {
        fallbackCopy();
      }
    }

    function fallbackCopy() {
      var ta = document.createElement('textarea');
      ta.value = generatedScript;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch(e) {}
      document.body.removeChild(ta);
      var btn = document.getElementById('copy-btn');
      btn.textContent = 'Copied!';
      setTimeout(function() { btn.textContent = 'Copy Script'; }, 2000);
    }

    function reset() {
      generatedScript = '';
      document.getElementById('setup-screen').classList.remove('hidden');
      document.getElementById('run-screen').classList.remove('show');
    }

    document.getElementById('generate-btn').addEventListener('click', generate);
    document.getElementById('copy-btn').addEventListener('click', copyScript);
    document.querySelector('#run-screen .btn-secondary').addEventListener('click', reset);
    document.getElementById('date').addEventListener('input', updateOpens);
    document.getElementById('time').addEventListener('input', updateOpens);

    window.addEventListener('DOMContentLoaded', function() {
      ['date','time','userId','ruleId','duration','token'].forEach(function(id) {
        var v = localStorage.getItem('kb_' + id);
        if (v) document.getElementById(id).value = v;
      });
      setDateMin();
      updateOpens();
    });
})();
  </script>
